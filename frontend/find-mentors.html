<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Find Mentors — OnceU</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-body">

<!-- ============ TOPBAR ============ -->
<header class="topbar">
  <div class="topbar__brand">
    <img src="assets/logo.png" alt="OnceU logo" class="topbar__logo" />
    <span class="topbar__name">OnceU</span>
  </div>

  <div class="topbar__search">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/>
      <path d="m21 21-3.6-3.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <input type="text" placeholder="Search mentors, topics, or resources..." disabled />
  </div>

  <div class="topbar__actions">
    <div class="icon-dropdown-wrap">
      <button type="button" class="icon-btn" id="notifTrigger" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M13.7 21a2 2 0 0 1-3.4 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="icon-dropdown" id="notifDropdown" hidden>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <p>No notifications yet &mdash; mentor updates will show up here.</p>
      </div>
    </div>

    <div class="icon-dropdown-wrap">
      <button type="button" class="icon-btn" id="msgTrigger" aria-label="Messages">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M4 5.5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H9l-4 3.5v-3.5H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="icon-dropdown" id="msgDropdown" hidden>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 5.5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H9l-4 3.5v-3.5H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <p>No messages yet &mdash; chat opens once a mentor accepts your request.</p>
      </div>
    </div>

    <div class="user-menu" id="userMenu">
      <button type="button" class="user-menu__trigger" id="userMenuTrigger">
        <span class="avatar-circle" id="userAvatar">?</span>
        <span class="user-menu__info">
          <strong id="userGreetingName">Student</strong>
          <span id="userGreetingMeta">&mdash;</span>
        </span>
        <svg class="user-menu__chevron" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="user-menu__dropdown" id="userMenuDropdown" hidden>
        <a href="settings.html" class="user-menu__item">Settings</a>
        <button type="button" class="user-menu__item user-menu__item--danger" id="logoutBtn">Log out</button>
      </div>
    </div>
  </div>
</header>

<div class="app-shell app-shell--no-rail">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <nav class="sidebar__nav">
      <a href="dashboard.html" class="sidebar__link">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9.5a1 1 0 0 0 1 1h3.5v-6h3v6H17a1 1 0 0 0 1-1V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Home
      </a>
      <a href="find-mentors.html" class="sidebar__link is-active">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="m21 21-3.6-3.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Find Mentors
      </a>
      <a href="sessions.html" class="sidebar__link">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9.5h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        My Sessions
      </a>
      <a href="#" class="sidebar__link" data-soon>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v18H6.5A2.5 2.5 0 0 1 4 18.5v-13Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v18h5.5a2.5 2.5 0 0 0 2.5-2.5v-13Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        Resources
      </a>
      <a href="#" class="sidebar__link" data-soon>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="8.5" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/><circle cx="16.5" cy="9.5" r="2.4" stroke="currentColor" stroke-width="1.8"/><path d="M3 19.5c.6-3 2.6-4.8 5.5-4.8s4.9 1.8 5.5 4.8M14.7 15.3c2 .3 3.4 1.7 3.8 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Community
      </a>
      <a href="profile.html" class="sidebar__link">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="12" cy="12" r="3.4" stroke="currentColor" stroke-width="1.8"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.8a7 7 0 0 0-2.1-1.2L14 3h-4l-.5 2.5a7 7 0 0 0-2.1 1.2l-2.3-.8-2 3.4 2 1.5A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.2l-2 1.5 2 3.4 2.3-.8a7 7 0 0 0 2.1 1.2L10 21h4l.5-2.5a7 7 0 0 0 2.1-1.2l2.3.8 2-3.4-2-1.5c.06-.4.1-.8.1-1.2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        My Profile
      </a>
    </nav>

    <div class="sidebar__cta">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 3 3 7.5 12 12l9-4.5L12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M6 10.2V16c0 1 2.7 3 6 3s6-2 6-3v-5.8" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <p>Ask. Connect.<br>Learn. <span aria-hidden="true">&#10084;</span></p>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="dash-main">

    <div class="page-head">
      <div>
        <h1 id="findHeading">Find Mentors</h1>
        <p id="findSubhead">Browse every senior matched to your year</p>
      </div>
    </div>

    <section class="mentors-section">
      <div class="find-toolbar">
        <div class="find-search">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/>
            <path d="m21 21-3.6-3.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Search by name or topic (e.g. DSA, hackathons)" />
        </div>

        <label class="find-filter">
          <span>Branch</span>
          <select id="branchFilter">
            <option value="all">All branches</option>
            <option value="ECE">ECE</option>
            <option value="CSE">CSE</option>
            <option value="IT">IT</option>
            <option value="MAE">MAE</option>
          </select>
        </label>
      </div>

      <p class="find-count" id="findCount"></p>

      <div class="mentor-grid" id="mentorGrid"></div>
      <p class="empty-state" id="emptyState" hidden></p>
    </section>

  </main>

</div>

<script src="js/common.js"></script>
<script src="js/mentors-data.js"></script>
<script src="js/sessions-data.js"></script>
<script src="js/find-mentors.js"></script>
</body>
</html>
